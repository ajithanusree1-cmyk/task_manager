<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      background: linear-gradient(#1c92d2, #6a11cb);
      color: white;
      padding: 20px;
    }

    .sidebar button {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      background: transparent;
      border: 1px solid white;
      color: white;
      cursor: pointer;
    }

    .main {
      flex: 1;
      padding: 20px;
      background: #f4f6f9;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      padding: 20px;
      color: white;
      border-radius: 10px;
    }

    .blue { background: #1c92d2; }
    .purple { background: #6a11cb; }
    .green { background: #00b09b; }

    .box {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 8px;
      margin: 5px;
    }

    button {
      background: #6a11cb;
      color: white;
      border: none;
      cursor: pointer;
    }

    .remove-btn {
      background: red;
      color: white;
      margin-left: 10px;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Task Manager</h2>
  <button onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

  <h2>Dashboard</h2>

  <!-- STATS -->
  <div class="cards">
    <div class="card blue" id="totalCard">Total: 0</div>
    <div class="card purple" id="completedCard">Completed: 0</div>
    <div class="card green" id="pendingCard">Pending: 0</div>
  </div>

  <!-- ADMIN SECTION -->
  <div id="adminSection">

    <!-- CREATE PROJECT -->
    <div class="box">
      <h3>Create Project</h3>
      <input id="projectName" placeholder="Project Name">
      <button onclick="createProject()">Create</button>
      <p id="projectId"></p>

      <input id="deleteProjectId" placeholder="Project ID to delete">
      <button onclick="deleteProject()">Delete Project</button>
    </div>

    <!-- MANAGE MEMBERS -->
    <div class="box">
      <h3>Manage Members</h3>

      <input id="memberEmails" placeholder="Emails (comma separated)">
      
      <!-- AUTO LOAD MEMBERS -->
      <input id="memberProjectId" placeholder="Project ID" oninput="showMembers()">

      <button onclick="addMember()">Add Members</button>

      <ul id="memberList"></ul>
    </div>

  </div>

  <!-- CREATE TASK -->
  <div class="box">
    <h3>Create Task</h3>
    <input id="taskTitle" placeholder="Task Title">
    <input id="taskProjectId" placeholder="Project ID" onblur="loadMembers(this.value)">
    <select id="assignedTo"></select>
    <button onclick="createTask()">Create Task</button>
  </div>

  <!-- TASKS -->
  <div class="box">
    <h3>Tasks</h3>
    <button onclick="loadTasks()">Load Tasks</button>
    <ul id="tasks"></ul>
  </div>

</div>

<script>
const API = "http://localhost:5000";

const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

// 🔐 ROLE CHECK
if (role !== "admin") {
  document.getElementById("adminSection").style.display = "none";
}

// LOGOUT
function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

// CREATE PROJECT
async function createProject() {
  const res = await fetch(API + "/api/projects", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ name: projectName.value })
  });

  const data = await res.json();
  projectId.innerText = "Project ID: " + data._id;
}

// DELETE PROJECT
async function deleteProject() {
  await fetch(API + "/api/projects/" + deleteProjectId.value, {
    method: "DELETE",
    headers: { "Authorization": token }
  });

  alert("Project deleted");
}

// ADD MEMBERS
async function addMember() {
  const emails = memberEmails.value.split(",");

  for (let email of emails) {
    await fetch(API + "/api/projects/add-member", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": token
      },
      body: JSON.stringify({
        email: email.trim(),
        projectId: memberProjectId.value
      })
    });
  }

  showMembers();
}

// SHOW MEMBERS + REMOVE
async function showMembers() {
  const projectId = memberProjectId.value;

  if (!projectId) return;

  const res = await fetch(API + "/api/projects", {
    headers: { "Authorization": token }
  });

  const projects = await res.json();
  const project = projects.find(p => p._id === projectId);

  const list = document.getElementById("memberList");
  list.innerHTML = "";

  if (!project) return;

  project.members.forEach(m => {
    const li = document.createElement("li");

    li.innerHTML = `
      ${m.name} (${m.email})
      <button class="remove-btn" onclick="removeMember('${m._id}')">Remove</button>
    `;

    list.appendChild(li);
  });
}

// REMOVE MEMBER
async function removeMember(userId) {
  const res = await fetch(API + "/api/projects/remove-member", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      projectId: memberProjectId.value,
      userId
    })
  });

  const data = await res.json();
  alert(data.message);

  showMembers();
}

// LOAD MEMBERS FOR TASK
async function loadMembers(projectId) {
  const res = await fetch(API + "/api/projects", {
    headers: { "Authorization": token }
  });

  const projects = await res.json();
  const project = projects.find(p => p._id === projectId);

  const select = document.getElementById("assignedTo");
  select.innerHTML = "";

  if (!project) return;

  project.members.forEach(m => {
    const option = document.createElement("option");
    option.value = m._id;
    option.textContent = `${m.name} (${m.email})`;
    select.appendChild(option);
  });
}

// CREATE TASK
async function createTask() {
  await fetch(API + "/api/tasks", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      title: taskTitle.value,
      project: taskProjectId.value,
      assignedTo: assignedTo.value
    })
  });

  alert("Task Created");
}

// LOAD TASKS
async function loadTasks() {
  const res = await fetch(API + "/api/tasks", {
    headers: { "Authorization": token }
  });

  const tasks = await res.json();

  const list = document.getElementById("tasks");
  list.innerHTML = "";

  tasks.forEach(t => {
    const li = document.createElement("li");
    li.innerHTML = `
      ${t.title} - ${t.status}
      <button onclick="completeTask('${t._id}')">Complete</button>
    `;
    list.appendChild(li);
  });
}

// COMPLETE TASK
async function completeTask(id) {
  await fetch(API + "/api/tasks/" + id, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ status: "completed" })
  });

  loadTasks();
}

// DASHBOARD STATS
async function loadDashboard() {
  const res = await fetch(API + "/api/tasks/dashboard", {
    headers: { "Authorization": token }
  });

  const data = await res.json();

  totalCard.innerText = "Total: " + data.total;
  completedCard.innerText = "Completed: " + data.completed;
  pendingCard.innerText = "Pending: " + data.pending;
}

loadDashboard();
</script>

</body>
</html>
